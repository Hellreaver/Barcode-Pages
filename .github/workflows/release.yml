name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ToteBarcodes.apk
          gh release create "v1.0.${{ github.run_number }}" ToteBarcodes.apk \
            --target "${{ github.sha }}" \
            --title "Tote Barcodes 1.0.${{ github.run_number }}" \
            --notes "Download ToteBarcodes.apk below on the phone, open it, and allow the install. Each build installs over the last one."
