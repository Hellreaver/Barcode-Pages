name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two quick pushes can't both claim the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the release notes can list every commit since the last release.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Load signing key
        id: key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "::warning::SIGNING_KEYSTORE secret is not set, so this run builds and tests but publishes no release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SIGNING_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick version
        id: ver
        run: |
          # Versions go 1.15, 1.16 ... 1.19, 1.20 ... 1.99, 2.00: two digits after the dot, one step per
          # published release, counted from the newest release tag, so a failed build leaves no gap.
          # The number without the dot is the Android versionCode (1.15 is 115).
          LAST="$(git tag -l 'v*' | sed -n 's/^v\([0-9][0-9]*\)\.\([0-9][0-9]\)$/\1 \2/p' \
            | awk '{ print $1 * 100 + $2 }' | sort -n | tail -1)"
          CODE=$(( ${LAST:-114} + 1 ))
          NAME="$(printf '%d.%02d' $(( CODE / 100 )) $(( CODE % 100 )))"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "This build is $NAME (versionCode $CODE)"

      - name: Test and build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          # Version in the file name, so downloads on the phone are easy to tell apart.
          APK="Barcode-Pages-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"

          # Release notes come from CHANGELOG.md, the way delivery-tracker does it: the
          # "Unreleased" section becomes this version.
          if python3 .github/scripts/changelog.py stamp "$VERSION"; then
            python3 .github/scripts/changelog.py notes "$VERSION" > notes.md
          else
            # Nothing written under "Unreleased": list the commit subjects since the last release.
            echo "::warning::CHANGELOG.md has nothing under Unreleased; using commit subjects as the notes."
            PREV="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
            {
              echo "## What changed"
              echo
              git log --no-merges --format='- %s' ${PREV:+"$PREV..HEAD"}
              echo
              echo "## Install"
              echo
              echo "Download the .apk file below on the phone, open it, and allow the install. It installs over the previous version."
            } > notes.md
          fi
          cat notes.md

          gh release create "v$VERSION" "$APK" \
            --target "${{ github.sha }}" \
            --title "Barcode-Pages $VERSION" \
            --notes-file notes.md

      - name: Save CHANGELOG.md
        if: steps.key.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          # Commit the renamed heading back to main. A push made with the workflow's own token
          # does not start another workflow run.
          git diff --quiet -- CHANGELOG.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Changelog: $VERSION" -- CHANGELOG.md
          git fetch -q origin main
          if git rebase -q origin/main && git push -q origin HEAD:main; then
            echo "CHANGELOG.md saved with its $VERSION heading"
          else
            git rebase --abort 2>/dev/null || true
            echo "::warning::Couldn't save CHANGELOG.md. Rename its Unreleased heading to $VERSION by hand."
          fi

      - name: Sync release notes from CHANGELOG.md
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every version with a CHANGELOG.md section gets that section as its release notes, so
          # corrections to an older entry reach its release page on the next build.
          for v in $(python3 .github/scripts/changelog.py versions); do
            gh release view "v$v" > /dev/null 2>&1 || continue
            python3 .github/scripts/changelog.py notes "$v" > section.md
            gh release edit "v$v" --notes-file section.md > /dev/null && echo "notes updated: v$v"
          done
