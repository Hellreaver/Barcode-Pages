name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        id: key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "::warning::SIGNING_KEYSTORE secret is not set, so this run builds and tests but publishes no release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SIGNING_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Version in the file name, so downloads on the phone are easy to tell apart.
          VERSION="1.0.${{ github.run_number }}"
          APK="Barcode-Pages-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v$VERSION" "$APK" \
            --target "${{ github.sha }}" \
            --title "Barcode-Pages $VERSION" \
            --notes "Download $APK below on the phone, open it, and allow the install. Each build installs over the last one."
